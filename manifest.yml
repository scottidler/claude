link:
  recursive: true
  HOME: $HOME
  dirs:
    HOME/.claude/skills: $HOME/.claude/skills
    HOME/.claude/agents: $HOME/.claude/agents
    HOME/.claude/output-styles: $HOME/.claude/output-styles
    # pi resource dirs are linked whole so new prompts/extensions/themes appear
    # without re-running manifest. AGENTS.md, APPEND_SYSTEM.md, and settings.json
    # ride the recursive file link above. `~/.pi/agent/` itself stays a real dir:
    # pi writes sessions/, auth, and trust.json into it.
    HOME/.pi/agent/prompts: $HOME/.pi/agent/prompts
    HOME/.pi/agent/extensions: $HOME/.pi/agent/extensions
    HOME/.pi/agent/themes: $HOME/.pi/agent/themes

github:
  mattpocock/skills:
    link:
      # No handoff entry: chunk A (5faca7d) replaced the upstream symlink with a
      # local skill at HOME/.claude/skills/handoff. The stale link survived and
      # would clobber the local file on the next apply.
      skills/productivity/grill-me: ~/.claude/skills/grill-me
      # grill-me/SKILL.md:7 is one line: "Run a `/grilling` session." Without
      # this link that skill invokes a skill that is not installed, which 10
      # user hits found the hard way. Model-invocable by design (Addendum A.3):
      # upstream carries no disable-model-invocation and a local override would
      # be a maintained fork of a one-line link.
      skills/productivity/grilling: ~/.claude/skills/grilling
      skills/productivity/teach: ~/.claude/skills/teach
  crafter-station/skills:
    link:
      context-engineering/intent-layer: ~/.claude/skills/intent-layer
  mvanhorn/last30days-skill:
    link:
      skills/last30days: ~/.claude/skills/last30days

# Claude tooling installed as isolated CLIs on PATH.
pipx:
  items:
  # Google Slides MCP server (entry point: gslides-mcp). Not on PyPI; install
  # from git. Registered at user scope by the mcp-servers script step below.
  - git+https://github.com/jemmanuele/gslide-mcp.git

script:
  # gslide-mcp reuses the gws "home" profile's Desktop OAuth client instead of a
  # separate Google Cloud client. Link gws's client_secret.json as gslide-mcp's
  # credentials.json (same account/client/project; APIs already enabled). The
  # first MCP tool call mints token.json next to it via a one-time browser
  # consent. Idempotent; safe to re-run. Requires `gws` home login to exist.
  gslides-creds: |
    mkdir -p ~/.gslides-mcp/creds
    ln -sf ~/.config/gws/home/client_secret.json ~/.gslides-mcp/creds/credentials.json
    echo "gslides-mcp credentials linked from gws home profile"

  # Global MCP servers, managed together at USER scope (available in every project).
  # This is the source of truth: ~/.claude.json is the opaque deploy target and is
  # NOT version-controlled, and Claude Code has no tracked-file / --mcp-config path
  # for global servers, so we re-register idempotently via `claude mcp add-json`.
  # Single-quoted JSON keeps ${VAR} literal for Claude Code's launch-time expansion.
  # Assumes each server's binary is already on PATH (gslides-mcp, uvx, npx, the
  # cloned slack/persona MCP repos under ~/repos). Safe to re-run.
  # NOTE: oracle WAS intentionally project-scoped (~/.mcp.json only), but that
  # kept vault retrieval out of every other Claude session. Decision reversed
  # 2026-07-02: oracle resolves its vault from ~/.config/sb/oracle.yml
  # regardless of CWD, so it registers at user scope like everything else. The
  # stray project-scope entry in ~/.mcp.json was cleaned up 2026-07-08; the
  # `remove -s project` below is defensive in case it ever reappears.
  # hindsight-work/hindsight-home point at $HINDSIGHT_API_URL (default
  # https://hindsight-api.escote.duckdns.org, Caddy + Authelia in front of the
  # Hindsight container from homelab/; set it to override). The Authorization
  # header comes from the `headersHelper` HOME/.claude/bin/hindsight-headers,
  # which decrypts the keep secret at every connect. A static
  # ${ESCOTE_HINDSIGHT_API_BASIC} header expanded from claude's own process env,
  # so claude launched from a shell older than the secret sent `Basic ` and got
  # 401 (2026-10-02: herdr pane shell from 09-25, secret added 09-27). Registration succeeds
  # even if that container isn't up yet (no connectivity check), but the tools
  # won't actually work until it is; bring it up first on a fresh machine.
  mcp-servers: |
    HINDSIGHT_API_URL="${HINDSIGHT_API_URL:-https://hindsight-api.escote.duckdns.org}"
    claude mcp remove atlassian -s user 2>/dev/null || true; claude mcp add-json atlassian '{"type":"http","url":"https://mcp.atlassian.com/v1/mcp"}' -s user
    claude mcp remove persona -s user 2>/dev/null || true; claude mcp add-json persona '{"type":"stdio","command":"/home/saidler/.cargo/bin/persona","args":["mcp","serve"],"env":{}}' -s user
    claude mcp remove clyde -s user 2>/dev/null || true; claude mcp add-json clyde '{"type":"stdio","command":"clyde","args":["mcp","serve"],"env":{}}' -s user
    claude mcp remove marquee -s user 2>/dev/null || true; claude mcp add-json marquee '{"type":"stdio","command":"/home/saidler/.cargo/bin/marquee","args":["mcp","serve"],"env":{}}' -s user
    claude mcp remove slack -s user 2>/dev/null || true; claude mcp add-json slack '{"type":"stdio","command":"/home/saidler/.cargo/bin/slack","args":["mcp","serve"],"env":{"SLACK_VALET_URL":"https://valet.test.tatari.dev"}}' -s user
    claude mcp remove oracle -s project 2>/dev/null || true; claude mcp remove oracle -s user 2>/dev/null || true; claude mcp add-json oracle '{"type":"stdio","command":"sb","args":["oracle","serve"],"env":{}}' -s user
    claude mcp remove classifier -s user 2>/dev/null || true; claude mcp add-json classifier '{"type":"http","url":"https://classifier.dev/mcp"}' -s user
    claude mcp remove hindsight-work -s user 2>/dev/null || true; claude mcp add-json hindsight-work '{"type":"http","url":"'"$HINDSIGHT_API_URL"'/mcp/work/","headersHelper":"'"$HOME"'/repos/scottidler/claude/HOME/.claude/bin/hindsight-headers"}' -s user
    claude mcp remove hindsight-home -s user 2>/dev/null || true; claude mcp add-json hindsight-home '{"type":"http","url":"'"$HINDSIGHT_API_URL"'/mcp/home/","headersHelper":"'"$HOME"'/repos/scottidler/claude/HOME/.claude/bin/hindsight-headers"}' -s user
    echo "registered 9 MCP servers at user scope"

  # Put `pr-open`, the non-release PR-command composer, on PATH: ~/.claude/bin
  # is not on PATH, and the `gh pr create` line it prints is run as an agent's
  # own Bash tool call, so it has to be callable bare. See bin/pr-open's header
  # for why it prints the command instead of running it. (Release PRs come from
  # `bump release`.)
  pr-open-on-path: |
    mkdir -p /home/saidler/bin
    ln -sf "$HOME/.claude/bin/pr-open" "$HOME/bin/pr-open"
    echo "pr-open linked onto PATH (~/bin/pr-open)"

  # Daily relocation of Rust build artifacts onto the dedicated drive. The engine
  # lives in the relocate-targets skill (single source of truth); this puts it on
  # PATH as ~/bin/relocate-targets and installs the cron. Idempotent: a healthy
  # day only pre-links freshly-cloned repos. Runs at 02:00, before the 03:00
  # sweep-repos watermark cron -- relocation keeps the OS disk empty of build
  # output, the sweep keeps the dedicated drive from growing without bound.
  relocate-targets-cron: |
    mkdir -p /home/saidler/bin /home/saidler/.cache
    ln -sf "$HOME/.claude/skills/relocate-targets/scripts/relocate-targets" "$HOME/bin/relocate-targets"
    LINE='0 2 * * * /home/saidler/bin/relocate-targets >> /home/saidler/.cache/relocate-targets.log 2>&1'
    (crontab -l 2>/dev/null | grep -vE "relocate-targets-cron|/bin/relocate-targets"; echo "$LINE") | crontab -
    echo "relocate-targets daily cron installed"
