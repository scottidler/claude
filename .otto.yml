otto:
  api: 1
  tasks: [ci]

tasks:
  # Em-dash check over the touched-file lint list (rules/safety.md:17-28's pattern),
  # plus whitespace. The list grows chunk by chunk as later phases touch more files.
  # Grown 2026-09-13 by the implementation audit (finding M3): Phase 4 claimed
  # every file the PR edits leaves with zero em-dashes, and five did not, because
  # the gate never covered them. The rule is only as wide as this list.
  lint:
    help: "Em-dash check over the lint list, plus whitespace"
    bash: |
      set -e
      FILES=(
        HOME/.claude/CLAUDE.md
        HOME/.claude/WHOAMI.md
        HOME/.claude/skills/handoff/SKILL.md
        HOME/.claude/skills/anthropic-usage-report/SKILL.md
        HOME/.claude/skills/create-design-doc/SKILL.md
        HOME/.claude/skills/rails/hooks/index.ts
        HOME/.claude/skills/rails/hooks/index.test.ts
        HOME/repos/.claude/rules/git.md
        HOME/repos/.claude/rules/cli.md
        HOME/repos/.claude/rules/general.md
        HOME/repos/.claude/rules/taste.md
        HOME/repos/.claude/rules/pr.md
        HOME/.claude/agents/release-driver.md
        HOME/repos/.claude/refs/slack.md
        .otto.yml
        HOME/repos/.claude/rules/safety.md
        HOME/repos/.claude/rules/voice.md
        HOME/repos/.claude/rules/interaction.md
        HOME/repos/.claude/rules/secrets.md
        HOME/repos/.claude/rules/recall.md
        HOME/.claude/output-styles/edges.md
        HOME/.claude/hooks/ssh-agent-check.sh
        HOME/.claude/hooks/prose.sh
        HOME/.claude/hooks/prose-test.sh
        HOME/.claude/hooks/emdash.sh
        HOME/.claude/hooks/emdash-test.sh
        HOME/.claude/hooks/lib.sh
        HOME/.claude/hooks/lib-test.sh
        HOME/.claude/hooks/manifest-scope-guard.sh
        HOME/.claude/hooks/manifest-scope-guard-test.sh
        HOME/.claude/hooks/secret-echo-guard.sh
        HOME/.claude/hooks/secret-echo-guard-test.sh
        HOME/.claude/hooks/intent-guard.sh
        HOME/.claude/hooks/intent-guard-test.sh
        HOME/.claude/hooks/slack-post-guard.sh
        HOME/.claude/hooks/slack-post-guard-test.sh
        HOME/.claude/hooks/git-release-guard.sh
        HOME/.claude/hooks/git-release-guard-test.sh
        HOME/.claude/hooks/branch-name-guard.sh
        HOME/.claude/hooks/branch-name-guard-test.sh
        HOME/.claude/hooks/branch-pr-title-guard.sh
        HOME/.claude/hooks/branch-pr-title-guard-test.sh
        HOME/.claude/hooks/rewrite-cd-read.py
        HOME/.claude/hooks/rewrite-cd-read-test.sh
        HOME/.claude/hooks/hooks-preflight.sh
        HOME/.claude/hooks/hooks-preflight-test.sh
        HOME/.claude/hooks/hooks-resolve-lib.sh
        HOME/.claude/hooks/shapes.sh
        bin/hooks-resolve
        docs/design/2026-09-13-guard-precision.md
        docs/design/2026-09-13-guard-precision-implementation-notes.md
        docs/design/2026-09-13-guard-precision-phase0/evidence.md
        docs/design/2026-09-13-guard-precision-audit/synthesis.md
        docs/design/2026-09-13-guard-precision-audit/probes.md
        HOME/.claude/hooks/panel-round-guard.sh
        HOME/.claude/hooks/panel-round-guard-test.sh
        docs/design/2026-09-14-panel-round-cap.md
        docs/design/2026-09-14-panel-round-cap-implementation-notes.md
        docs/design/2026-09-14-panel-round-cap-phase0/evidence.md
        HOME/.claude/agents/review-panel-notes.md
        HOME/.claude/agents/review-panel-prompts.md
        HOME/.claude/agents/review-panel.md
        HOME/.claude/hooks/inline-skill-tokens.py
        HOME/.claude/hooks/inline-skill-tokens-test.sh
        HOME/.claude/hooks/inline/matcher.py
        HOME/.claude/hooks/inline/tests.py
        HOME/.claude/hooks/inline/resolve.py
        HOME/.claude/hooks/inline/resolve_tests.py
        HOME/.claude/hooks/inline-token-matcher-test.sh
        HOME/.claude/hooks/inline-name-resolution-test.sh
        HOME/.claude/skills/review-panel/SKILL.md
        HOME/.claude/skills/how-to-execute-a-plan/SKILL.md
        HOME/.claude/skills/bump/SKILL.md
        HOME/.claude/skills/shipit/SKILL.md
        HOME/.claude/skills/babysit/SKILL.md
        HOME/.claude/bin/pr-open
        HOME/.claude/bin/pr-open-test.sh
        HOME/.claude/bin/release
        docs/design/2026-09-17-dm-resolution-and-pipeline-glue.md
        docs/design/2026-09-17-dm-resolution-and-pipeline-glue-implementation-notes.md
        docs/design/2026-09-17-dm-resolution-and-pipeline-glue-phase0/evidence.md
        docs/design/2026-09-17-dm-resolution-and-pipeline-glue-phase3/evidence.md
        docs/design/2026-09-17-dm-resolution-and-pipeline-glue-phase3/derive.py
        docs/design/2026-09-17-dm-resolution-and-pipeline-glue-phase3/tally.py
        docs/design/2026-09-17-dm-resolution-and-pipeline-glue-phase3/must-deny.sh
        docs/design/2026-09-17-dm-resolution-and-pipeline-glue-phase3/variant-a.sh
        docs/design/2026-09-17-dm-resolution-and-pipeline-glue-phase3/variant-b.sh
        docs/design/2026-09-17-dm-resolution-and-pipeline-glue-phase3/variant-c.sh
        manifest.yml
        HOME/.claude/hooks/session-recall-guard.sh
        HOME/.claude/hooks/session-recall-guard-test.sh
        docs/design/2026-09-17-session-recall.md
      )
      if rg -n '\x{2014}' "${FILES[@]}"; then
        echo "Found an em dash in the lint list above."
        exit 1
      fi
      # Every rules/*.md carries YAML frontmatter as its first line, except
      # voice.md by design (it has no frontmatter block). A file that loses
      # its leading `---` (e.g. a stray WORKAROUND comment reintroduced above
      # it) silently drops out of Claude Code's always-on rule loading.
      BAD_FRONTMATTER=$(awk 'FNR==1 && $0 != "---" {print FILENAME}' HOME/repos/.claude/rules/*.md)
      if [ "$BAD_FRONTMATTER" != "HOME/repos/.claude/rules/voice.md" ]; then
        echo "Rules frontmatter check failed, expected only voice.md, got:"
        echo "$BAD_FRONTMATTER"
        exit 1
      fi
      whitespace -r

  # Every HOME/.claude/hooks/*-test.sh regression matrix, plus the rails plugin's
  # bun tests.
  test:
    help: "Run the hook regression matrices and the rails plugin's bun tests"
    bash: |
      set -e
      for t in HOME/.claude/hooks/*-test.sh; do
        echo "=== $t ==="
        bash "$t"
      done
      echo "=== bin/hooks-resolve ==="
      bin/hooks-resolve
      echo "=== HOME/.claude/bin/pr-open-test.sh ==="
      bash HOME/.claude/bin/pr-open-test.sh
      (cd HOME/.claude/skills/rails/hooks && bun test)

  ci:
    help: "Full CI pipeline (lint + test)"
    before: [lint, test]
    bash: |
      echo "✅ All CI checks passed!"
