# Slack app manifest for "Tatari Slack Toolkit" - the app that mints the user
# tokens this skill runs on. This file is the SINGLE SOURCE OF TRUTH for the
# app's scopes; do not re-type them from memory. To change scopes, edit here,
# then paste into the app's App Manifest editor and reinstall.
#
# USER-TOKEN ONLY by design: no bot_user, no bot scopes. A bot would have to be
# invited to every private channel and still couldn't search or read DMs; a user
# token sees exactly what the authorizing user can, which is the correct boundary.
#
# SCOPE PRINCIPLE: match the scopes the user actually has in use - do NOT trim to
# "what the current code path needs." The feature surface grows (e.g. `preview`
# needs im:write to open the self-DM), and speculative trimming just forces
# painful re-installs. The list below is Scott's working user-scope set plus
# search:read (which search.messages requires and was the only one missing).
display_information:
  name: Tatari Slack Toolkit
  description: Export, read, send, search, and preview Slack on your behalf via your own user token.
oauth_config:
  redirect_urls:
    - https://example.com/slack/oauth/callback   # PLACEHOLDER - swap for the vending endpoint before distributing
  scopes:
    user:
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - users:read
      - search:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
